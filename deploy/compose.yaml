# Local verification only: isolated database and loopback entry, no real user data.
name: outdoor-local
x-app: &app
  image: outdoor-local:${IMAGE_TAG:-dev}
  build:
    context: ..
    dockerfile: Dockerfile
  environment: &environment
    APP_ENV: production
    DATABASE_URL: postgresql://outdoor:${POSTGRES_PASSWORD:?Run prepare-local.py first}@db:5432/outdoor
    SECRET_KEY: ${SECRET_KEY:?Run prepare-local.py first}
    STATIC_DIR: /app/static
    CORS_ORIGINS: ""
    DEBUG: "false"
  networks:
    - database
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: outdoor
      POSTGRES_DB: outdoor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare-local.py first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outdoor -d outdoor"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8000"
    networks:
      - entry
      - database
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  pipeline:
    image: outdoor-local-pipeline:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://outdoor:${POSTGRES_PASSWORD:?Run prepare-local.py first}@db:5432/outdoor
      SECRET_KEY: ${SECRET_KEY:?Run prepare-local.py first}
      PIPELINE_TOOLS_DIR: /app/tools/guide-pipeline
      PIPELINE_CORPUS_ROOT: /app/corpus
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # 语料库（gitignore 本地数据，运行时挂载而非 COPY 进镜像）；宿主机没有 corpus/
      # 时 compose 会自动创建空目录；原生 Linux 下需保证容器内 pwuser（UID 1000）可写
      - ../corpus:/app/corpus
      # 平台登录 cookie（gitignore，含登录凭据，勿提交勿外发）：读写挂载，扫码登录后落盘持久化
      - ../tools/guide-pipeline/.cookies:/app/tools/guide-pipeline/.cookies
    networks:
      # 采集需要出网访问小红书/微博/携程等平台：database 是 internal 网络（无出网路由），
      # 必须同时挂 entry 网络，否则采集请求必失败
      - entry
      - database
    healthcheck:
      # worker 无 HTTP 端口：确认 PID 1 是调度进程本身
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if 'app.pipeline.worker' in open('/proc/1/cmdline').read() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  demo:
    <<: *app
    profiles: ["tools"]
    environment:
      <<: *environment
      ENABLE_DEMO_DATA: "true"
    command: ["python", "-m", "app.seed_demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

networks:
  entry:
  database:
    internal: true
volumes:
  pgdata:
