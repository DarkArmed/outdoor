<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元宝的户外大冒险 · 首页</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
  <div id="hero-scene"></div>
  <h1 id="hero-title">🏕️ 元宝的户外大冒险</h1>
  <p class="subtitle" id="hero-subtitle">爸爸 + 小勇士 · 北京出发 · 每周末一次</p>
  <nav class="hero-links">
    <button class="hero-link" data-tab="badges">🏅 徽章</button>
    <button class="hero-link" data-tab="footprint">🗺️ 足迹</button>
  </nav>
</header>

<main>
  <div class="home-layout">
    <aside id="month-rail" class="month-rail"></aside>
    <div class="home-content">
      <div id="month-rows"></div>

      <section id="archive-section">
        <h2>📦 备用计划</h2>
        <p class="muted">去过的、暂缓的计划放这里，以后改期还能用</p>
        <div id="archive-grid" class="plan-grid"></div>
      </section>

      <section class="safety-banner">
        <h2>🛡️ 安全口诀（每次出发前念一遍）</h2>
        <ul>
          <li>💦 下水穿救生衣，浅滩不过膝，大人不离眼</li>
          <li>🪨 湿石头不踩，滑倒最危险</li>
          <li>🧴 帽子防晒霜，水要喝够</li>
          <li>🗺️ 离线地图先下好</li>
          <li>😊 累了就回家，下次还想来</li>
        </ul>
      </section>
    </div>
  </div>
</main>

<!-- 成就面板：右侧侧滑抽屉（徽章墙 / 足迹大地图），主页只留 Hero 入口 -->
<div id="achieve-backdrop" class="drawer-backdrop" aria-hidden="true"></div>
<aside id="achieve-drawer" class="drawer" aria-label="成就面板" aria-hidden="true">
  <div class="drawer-head">
    <h2>🎖️ 成就面板</h2>
    <button id="achieve-close" class="drawer-close" aria-label="关闭">✕</button>
  </div>
  <nav class="drawer-tabs">
    <button class="drawer-tab active" data-tab="badges">🏅 徽章</button>
    <button class="drawer-tab" data-tab="footprint">🗺️ 足迹</button>
  </nav>
  <div class="drawer-body">
    <section class="drawer-panel" data-panel="badges">
      <div id="badge-wall" class="badge-wall"></div>
      <p id="stats-bar" class="stats-bar"></p>
    </section>
    <section class="drawer-panel" data-panel="footprint" hidden>
      <h3>🗺️ 我们的足迹</h3>
      <div id="footprint-map" class="footprint-map"></div>
    </section>
  </div>
</aside>

<footer>
  <p>🌲 路线图是示意图，导航请用两步路/高德 · 本地离线网站，数据存在浏览器里</p>
</footer>

<script src="js/scenes.js"></script>
<script src="js/maps.js"></script>
<script src="js/data/profile.js"></script>
<script src="js/data/data-a.js"></script>
<script src="js/data/data-b.js"></script>
<script src="js/data/data-c.js"></script>
<script src="js/data/data-d.js"></script>
<script src="js/data/routes.js"></script>
<script src="js/data/network.js"></script>
<script src="js/app.js"></script>
</body>
</html>
