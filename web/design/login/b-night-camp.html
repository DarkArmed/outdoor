<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 B · 星空夜营</title>
<style>
  :root {
    --night:#2B3A67; --night-dk:#1E2B4A; --sun:#FFD93D; --orange:#FFA94D;
    --sky-deep:#4FC3F7; --ink:#2D3748; --muted:#718096;
  }
  * { box-sizing:border-box; margin:0; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Comic Sans MS",system-ui,sans-serif;
    color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(#141C33 0%, #2B3A67 60%, #3D4F7C 100%);
    overflow:hidden; position:relative; padding:24px;
  }
  .scene { position:fixed; inset:auto 0 0 0; width:100%; pointer-events:none; }
  .scene svg { display:block; width:100%; height:auto; }
  .glow {
    position:fixed; left:50%; bottom:6vh; width:520px; height:520px;
    transform:translateX(-50%); border-radius:50%;
    background:radial-gradient(circle, rgb(255 217 61 / 28%) 0%, rgb(255 159 67 / 12%) 40%, transparent 70%);
    animation:flicker 2.6s ease-in-out infinite; pointer-events:none;
  }
  @keyframes flicker { 0%,100% { opacity:.85; transform:translateX(-50%) scale(1);} 50% { opacity:1; transform:translateX(-50%) scale(1.06);} }
  .card {
    position:relative; z-index:2; width:min(420px, 94vw);
    background:rgb(255 253 245 / 96%);
    border-radius:24px; padding:36px 32px 28px;
    box-shadow:0 0 0 4px rgb(255 217 61 / 18%), 0 24px 60px rgb(0 0 0 / 45%);
    display:grid; gap:16px; text-align:center;
  }
  .card h1 { font-size:1.7rem; }
  .card .sub { color:var(--muted); font-size:.95rem; margin-top:-10px; }
  .field { position:relative; text-align:left; }
  .field .ico { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:1.05rem; }
  .field input {
    width:100%; padding:13px 14px 13px 44px; font-size:1rem;
    border:2px solid #E2E8F0; border-radius:14px; background:#fff; color:var(--ink);
  }
  .field input:focus { outline:none; border-color:var(--orange); box-shadow:0 0 0 4px rgb(255 169 77 / 22%); }
  .go {
    padding:14px; border:0; border-radius:999px; font-size:1.1rem; font-weight:700;
    background:linear-gradient(135deg, #FFD93D, #FFA94D); color:#5B3A00; cursor:pointer;
    box-shadow:0 4px 0 #C77E1F; transition:transform .12s, box-shadow .12s;
  }
  .go:hover { transform:translateY(-2px); box-shadow:0 6px 0 #C77E1F; }
  .go:active { transform:translateY(2px); box-shadow:0 2px 0 #C77E1F; }
  .reg { font-size:.92rem; color:var(--muted); }
  .reg a { color:var(--sky-deep); font-weight:700; text-decoration:none; }
  .tag { font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>

<div class="glow"></div>

<div class="scene">
  <svg viewBox="0 0 1440 460" preserveAspectRatio="xMidYMax slice">
    <!-- 星星 -->
    <g fill="#FFF9DB">
      <circle cx="120" cy="60" r="2.5"/><circle cx="300" cy="30" r="2"/><circle cx="480" cy="80" r="3"/>
      <circle cx="660" cy="40" r="2"/><circle cx="820" cy="90" r="2.5"/><circle cx="1000" cy="36" r="2"/>
      <circle cx="1180" cy="70" r="3"/><circle cx="1330" cy="44" r="2"/><circle cx="220" cy="130" r="2"/>
      <circle cx="560" cy="140" r="2"/><circle cx="920" cy="150" r="2"/><circle cx="1260" cy="120" r="2.5"/>
      <circle cx="760" cy="20" r="2"/><circle cx="80" cy="160" r="2"/><circle cx="1100" cy="110" r="2"/>
    </g>
    <!-- 流星 -->
    <line x1="1120" y1="60" x2="1180" y2="30" stroke="#FFF9DB" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <!-- 月亮 -->
    <g transform="translate(1240,110)">
      <circle r="42" fill="#FFF4C2"/>
      <circle cx="-16" cy="-10" r="33" fill="#2B3A67"/>
    </g>
    <!-- 夜山 -->
    <path d="M0 300 Q 220 200 460 280 T 980 260 T 1440 270 V 460 H 0 Z" fill="#3D4F7C"/>
    <path d="M0 350 Q 300 260 640 340 T 1440 320 V 460 H 0 Z" fill="#2F3E63"/>
    <!-- 夜树 -->
    <g transform="translate(130,320) scale(1.2)"><rect x="-5" y="0" width="10" height="22" rx="3" fill="#22304F"/><path d="M0 -70 L 26 -28 H 14 L 30 0 H -30 L -14 -28 H -26 Z" fill="#1E2B4A"/></g>
    <g transform="translate(1330,330)"><rect x="-6" y="0" width="12" height="34" rx="4" fill="#22304F"/><circle cx="0" cy="-18" r="30" fill="#1E2B4A"/><circle cx="-20" cy="-4" r="20" fill="#1E2B4A"/><circle cx="20" cy="-4" r="20" fill="#1E2B4A"/></g>
    <!-- 帐篷（透出暖光） -->
    <g transform="translate(300,400) scale(1.1)">
      <path d="M0 0 L 60 -78 L 120 0 Z" fill="#FF8A65"/>
      <path d="M60 -78 L 120 0 H 78 L 60 -34 Z" fill="#E85D3D"/>
      <path d="M60 -34 L 78 0 H 42 Z" fill="#FFD93D"/>
      <line x1="-8" y1="0" x2="128" y2="0" stroke="#22304F" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- 篝火 -->
    <g transform="translate(720,415) scale(1.1)">
      <line x1="-22" y1="4" x2="22" y2="-6" stroke="#8D5A3B" stroke-width="9" stroke-linecap="round"/>
      <line x1="-22" y1="-6" x2="22" y2="4" stroke="#8D5A3B" stroke-width="9" stroke-linecap="round"/>
      <path d="M0 -52 Q 16 -30 10 -14 Q 24 -20 18 -36 Q 34 -18 18 0 H -18 Q -34 -18 -18 -36 Q -24 -20 -10 -14 Q -16 -30 0 -52 Z" fill="#FF9F43"/>
      <path d="M0 -32 Q 10 -18 6 -8 Q 14 -12 12 -22 Q 20 -10 10 0 H -10 Q -20 -10 -12 -22 Q -14 -12 -6 -8 Q -10 -18 0 -32 Z" fill="#FFD93D"/>
    </g>
    <!-- 父子看星星（剪影感） -->
    <g transform="translate(1010,398)">
      <g><line x1="-8" y1="0" x2="-8" y2="26" stroke="#22304F" stroke-width="9" stroke-linecap="round"/><line x1="8" y1="0" x2="8" y2="26" stroke="#22304F" stroke-width="9" stroke-linecap="round"/><rect x="-14" y="-34" width="28" height="38" rx="12" fill="#5B8DEF"/><circle cx="0" cy="-50" r="15" fill="#FFDCB5"/><circle cx="-5" cy="-52" r="2" fill="#333"/><circle cx="5" cy="-52" r="2" fill="#333"/><path d="M-5 -44 Q0 -40 5 -44" stroke="#333" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M-16 -56 A 16 16 0 0 1 16 -56 L 20 -52 H -20 Z" fill="#FFD93D"/></g>
      <g transform="translate(46,8) scale(.72)"><line x1="-8" y1="0" x2="-8" y2="26" stroke="#22304F" stroke-width="9" stroke-linecap="round"/><line x1="8" y1="0" x2="8" y2="26" stroke="#22304F" stroke-width="9" stroke-linecap="round"/><rect x="-14" y="-34" width="28" height="38" rx="12" fill="#FF6B6B"/><circle cx="0" cy="-50" r="15" fill="#FFDCB5"/><circle cx="-5" cy="-52" r="2" fill="#333"/><circle cx="5" cy="-52" r="2" fill="#333"/><path d="M-5 -44 Q0 -40 5 -44" stroke="#333" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M-16 -56 A 16 16 0 0 1 16 -56 L 20 -52 H -20 Z" fill="#FFA94D"/></g>
    </g>
  </svg>
</div>

<form class="card">
  <h1>🌙 户外大冒险</h1>
  <p class="sub">篝火已生起，就等你回来</p>
  <div class="field"><span class="ico">📧</span><input type="email" placeholder="邮箱" aria-label="邮箱"></div>
  <div class="field"><span class="ico">🔒</span><input type="password" placeholder="密码" aria-label="密码"></div>
  <button class="go" type="button">回到营地 →</button>
  <p class="reg">还没有账号？<a href="#">加入探险队</a></p>
  <p class="tag">✨ 今晚晴，适合看星星</p>
</form>

</body>
</html>
